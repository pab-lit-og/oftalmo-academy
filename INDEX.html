        {text:"Queratocono bilateral → cross-linking + LC RPG/escleral, contraindicado LASIK", correct:true, explanation:"¡Correcto! Sospecha fundada de queratocono bilateral. Se debe: 1) confirmar con topografía serial y tomografía (Pentacam), 2) cross-linking para frenar progresión, 3) LC RPG o escleral para rehabilitación visual, 4) NUNCA cirugía refractiva ablativa."},
        {text:"Simple miopía progresiva → adaptar LC blandas y re-evaluar", correct:false, explanation:"No es simple miopía. Las banderas rojas: astigmatismo oblicuo, progresión rápida, topografía asimétrica, paquimetría fina."},
        {text:"Mala adaptación a gafas → mejorar el centrado", correct:false, explanation:"La AV es 1.0, así que las gafas están bien. El problema está en la córnea."}
      ]
    }
  },
  {
    id:4, icon:"💡", title:"Semiología Ocular", subtitle:"Lámpara de hendidura y fondo de ojo", color:"#ef4444",
    lessons:[
      {
        title:"Biomicroscopía (Lámpara de Hendidura)", emoji:"🔬",
        theory:[
          {heading:"¿Qué exploras?", text:"TODO el segmento anterior: párpados, pestañas, conjuntiva, córnea (5 capas), cámara anterior, iris, cristalino. Con lentes auxiliares: ángulo (gonioscopia) y fondo de ojo. Es tu microscopio clínico."},
          {heading:"Técnicas de iluminación", text:"Difusa: visión general. Paralelepípedo: haz estrecho inclinado → espesor corneal, infiltrados, cuerpos extraños. Sección óptica: haz fino → corte transversal de córnea. Retroiluminación: opacidades, vacuolas, pigmento. Dispersión escleral: haz en limbo → edema corneal difuso."},
          {heading:"Hallazgos clave", text:"Tinción fluoresceína: erosiones, úlceras → verdes con filtro azul. Tyndall +: células/proteínas en cámara anterior → uveítis. Precipitados queráticos: depósitos en endotelio → uveítis crónica. Catarata: opacidad del cristalino → nuclear, cortical, subcapsular posterior."}
        ],
        protocol:["Ajusta oculares a tu refracción, mentonera cómoda","Bajo aumento (10x) + difusa → barrido general","Párpados y pestañas → blefaritis, orzuelos, triquiasis","Conjuntiva → folículos, papilas, hiperemia, secreciones","Córnea → paralelepípedo y sección óptica: opacidades, infiltrados, neovasos","Fluoresceína + filtro azul cobalto → defectos epiteliales","Cámara anterior → Tyndall (haz fino, alto aumento): ¿hay células?","Iris → nódulos, sinequias, rubeosis","Cristalino → opacidades → clasifica localización y densidad"],
        pearls:["Ojo rojo + Tyndall positivo → uveítis hasta que se demuestre lo contrario","Úlcera corneal + LC = URGENCIA → cultivo + colirio reforzado, NUNCA parche ni corticoide","Catarata subcapsular posterior → muy sintomática aunque sea pequeña","Siempre evertir párpado superior → cuerpos extraños se esconden ahí"],
        videos:[{title:"Técnicas de iluminación en LH", url:"https://www.youtube.com/results?search_query=slit+lamp+illumination+techniques+ophthalmology"},{title:"Cómo evaluar Tyndall", url:"https://www.youtube.com/results?search_query=slit+lamp+anterior+chamber+cells+flare"}]
      },
      {
        title:"Fondo de Ojo y Tonometría", emoji:"🔴",
        theory:[
          {heading:"Fondo de ojo (Oftalmoscopia)", text:"Directa: con el oftalmoscopio directo → imagen derecha y aumentada → buena para papila y mácula rápida. Indirecta: con lente +20D o +28D → imagen invertida, mayor campo → el estándar en oftalmo para retina periférica."},
          {heading:"Qué evaluar en el fondo", text:"PAPILA: bordes nítidos, rosada, excavación C/D ≤0.3. Si excavación grande → glaucoma. MÁCULA: reflejo foveal, sin edema ni drusas. VASOS: A/V 2:3, cruces A-V (Gunn → HTA), exudados, hemorragias. PERIFERIA: desgarros, lattice, desprendimiento."},
          {heading:"Tonometría (PIO)", text:"Goldmann (aplanación) = gold standard. Normal: 10-21 mmHg. Sospecha glaucoma si: PIO >21, excavación >0.5, asimetría C/D >0.2, defectos campimétricos. La PIO por sí sola NO diagnostica glaucoma."},
          {heading:"Señales de peligro", text:"Edema de papila bilateral → hipertensión intracraneal → NEUROIMAGEN urgente. Hemorragias en llama + exudados algodonosos → retinopatía hipertensiva/diabética. Desprendimiento de retina → cortina visual + fotopsias → URGENCIA QUIRÚRGICA."}
        ],
        protocol:["Dilata: tropicamida 1% + fenilefrina 2.5% → espera 20-30 min","Directa: acerca el oftalmoscopio, enfoca papila, localiza mácula","Indirecta: paciente tumbado, lente +20D, imagen invertida","Evalúa: papila → mácula → vasos → periferia (4 cuadrantes)","Documenta: C/D ratio, hallazgos maculares, estado vascular","Tonometría: anestesia tópica + fluoresceína, cono de Goldmann en córnea","Semicírculos se superponen → leer mmHg"],
        pearls:["Dilatación contraindicada si cámara estrecha → gonioscopia antes si dudas","Fenilefrina contraindicada en HTA severa no controlada → solo tropicamida","C/D 0.8 con PIO 14 mmHg → puede ser glaucoma de tensión normal → campimetría","Retinopatía diabética: primero microaneurismas → si neovasos = proliferativa = láser urgente"],
        videos:[{title:"Oftalmoscopia directa", url:"https://www.youtube.com/results?search_query=direct+ophthalmoscopy+technique+tutorial"},{title:"Tonometría Goldmann", url:"https://www.youtube.com/results?search_query=goldmann+applanation+tonometry+technique"}]
      }
    ],
    caseStudy:{
      title:"Caso: Señora con ojo rojo y dolor",
      scenario:"Carmen, 68 años. Urgencias: ojo derecho rojo, dolor intenso, visión borrosa y halos alrededor de las luces desde hace 6 horas. Náuseas y cefalea hemicraneal derecha.",
      data:["AV: OD 0.1 / OI 0.8","Biomicroscopía OD: inyección mixta, edema corneal difuso, cámara anterior muy estrecha, pupila midriasis media fija","PIO: OD 56 mmHg / OI 18 mmHg","Gonioscopia OI: ángulo estrecho (Shaffer II)","Fondo OD: no valorable por edema corneal"],
      question:"¿Qué es y qué haces?",
      options:[
        {text:"Uveítis anterior aguda → corticoide + midriático", correct:false, explanation:"La PIO de 56 es incompatible con uveítis simple. Además la pupila está dilatada (en uveítis suele estar miótica). Cámara estrecha + PIO altísima → cierre angular."},
        {text:"Glaucoma agudo de ángulo cerrado → hipotensor urgente + iridotomía YAG", correct:true, explanation:"¡Correcto! Cuadro clásico. Tratamiento: 1) Pilocarpina 2%, 2) Timolol + brimonidina + dorzolamida tópicos, 3) Acetazolamida 250mg IV/oral, 4) Manitol IV si no baja, 5) Iridotomía YAG BILATERAL cuando ceda."},
        {text:"Conjuntivitis hiperaguda → antibiótico", correct:false, explanation:"La conjuntivitis no da PIO de 56, ni edema corneal, ni pupilas fijas."},
        {text:"Queratitis microbiana → raspado + colirios reforzados", correct:false, explanation:"El edema corneal aquí es difuso por la PIO, no un infiltrado focal. Cámara estrecha + PIO → cierre angular."}
      ]
    }
  }
];

function App() {
  const [view,setView] = useState("home");
  const [mod,setMod] = useState(null);
  const [lesson,setLesson] = useState(null);
  const [selOpt,setSelOpt] = useState(null);
  const [done,setDone] = useState({});
  const [openSec,setOpenSec] = useState(null);
  const [anim,setAnim] = useState(false);
  const topRef = useRef(null);

  useEffect(()=>{setAnim(true)},[]);
  const scrollTop = ()=> topRef.current && topRef.current.scrollIntoView({behavior:'smooth'});

  const markDone = (mId,lIdx)=> setDone(p=>({...p,[`${mId}-${lIdx}`]:true}));
  const isDone = (mId,lIdx)=> !!done[`${mId}-${lIdx}`];
  const modProg = (m)=> { const d=m.lessons.filter((_,i)=>isDone(m.id,i)).length; return Math.round((d/m.lessons.length)*100); };

  const goHome = ()=>{ setView("home"); setMod(null); setLesson(null); setSelOpt(null); setOpenSec(null); scrollTop(); };
  const openMod = (m)=>{ setMod(m); setView("module"); setLesson(null); setSelOpt(null); scrollTop(); };
  const openLesson = (l,i)=>{ setLesson({...l,idx:i}); setView("lesson"); setOpenSec(null); scrollTop(); };
  const openCase = ()=>{ setView("case"); setSelOpt(null); scrollTop(); };

  const totalL = MODULES.reduce((s,m)=>s+m.lessons.length,0);
  const totalD = Object.keys(done).length;

  const S = {
    page:{minHeight:"100vh",background:"linear-gradient(145deg,#0f172a 0%,#1e293b 50%,#0f172a 100%)",color:"#e2e8f0",fontFamily:"'DM Sans',sans-serif"},
    wrap:{maxWidth:600,margin:"0 auto",padding:"28px 20px 40px"},
    back:{background:"none",border:"none",color:"#64748b",fontSize:14,cursor:"pointer",padding:"8px 0",marginBottom:16,display:"flex",alignItems:"center",gap:6},
  };

  // === HOME ===
  if(view==="home") return (
    <div style={S.page}><div ref={topRef}/><div style={S.wrap}>
      <div style={{textAlign:"center",marginBottom:32,opacity:anim?1:0,transform:anim?"translateY(0)":"translateY(-20px)",transition:"all .6s ease"}}>
        <div style={{fontSize:52,marginBottom:4}}>🩺</div>
        <h1 style={{fontFamily:"'Fraunces',serif",fontSize:26,fontWeight:700,margin:0,background:"linear-gradient(135deg,#38bdf8,#818cf8)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>Oftalmo Academy</h1>
        <p style={{color:"#64748b",fontSize:13,marginTop:6}}>Preparado para el <strong style={{color:"#94a3b8"}}>Dr. Vázquez Gómez</strong></p>
        <p style={{color:"#475569",fontSize:11,marginTop:2}}>por Pablo · Óptico-Optometrista</p>
      </div>

      {/* Welcome card */}
      <div style={{background:"linear-gradient(135deg,#1e3a5f,#1e293b)",borderRadius:16,padding:"20px",marginBottom:24,border:"1px solid #334155"}}>
        <p style={{fontSize:13,lineHeight:1.7,color:"#94a3b8",margin:0}}>
          Bienvenido, <strong style={{color:"#e2e8f0"}}>Dr. Vázquez Gómez</strong>. Esto es una guía interactiva con los fundamentos de optometría clínica que vas a necesitar desde el primer día de residencia. Cada módulo tiene teoría directa, protocolos paso a paso, perlas clínicas y un caso interactivo para poner a prueba lo aprendido. Sin parrafadas — ve a tu ritmo.
        </p>
      </div>

      {/* Progress */}
      <div style={{background:"#1e293b",borderRadius:12,padding:"14px 18px",marginBottom:24,border:"1px solid #334155"}}>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:8}}>
          <span style={{color:"#94a3b8"}}>Progreso global</span>
          <span style={{color:"#38bdf8",fontWeight:700}}>{totalD}/{totalL} lecciones</span>
        </div>
        <div style={{height:8,background:"#0f172a",borderRadius:99}}>
          <div style={{height:"100%",borderRadius:99,width:`${totalL?(totalD/totalL)*100:0}%`,background:"linear-gradient(90deg,#38bdf8,#818cf8)",transition:"width .6s ease"}}/>
        </div>
      </div>

      {/* Modules */}
      {MODULES.map((m,i)=>{
        const p=modProg(m);
        return (
          <div key={m.id} onClick={()=>openMod(m)} style={{background:"linear-gradient(135deg,#1e293b,#1a2332)",borderRadius:16,padding:18,marginBottom:14,cursor:"pointer",border:`1px solid ${m.color}33`,position:"relative",overflow:"hidden",opacity:anim?1:0,transform:anim?"translateY(0)":"translateY(30px)",transition:`all .5s ease ${i*.1}s`}}>
            <div style={{position:"absolute",top:0,left:0,height:3,width:`${p}%`,background:m.color,transition:"width .5s"}}/>
            <div style={{display:"flex",alignItems:"center",gap:14}}>
              <div style={{fontSize:30,width:48,height:48,display:"flex",alignItems:"center",justifyContent:"center",background:`${m.color}15`,borderRadius:12}}>{m.icon}</div>
              <div style={{flex:1}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <h3 style={{margin:0,fontSize:15,fontWeight:700,color:"#f1f5f9"}}>{m.title}</h3>
                  <span style={{fontSize:11,color:m.color,fontWeight:700}}>{p}%</span>
                </div>
                <p style={{margin:"3px 0 0",fontSize:12,color:"#64748b"}}>{m.subtitle}</p>
                <p style={{margin:"5px 0 0",fontSize:11,color:"#475569"}}>{m.lessons.length} lecciones + caso clínico</p>
              </div>
              <div style={{color:"#475569",fontSize:20}}>›</div>
            </div>
          </div>
        );
      })}

      <div style={{textAlign:"center",marginTop:20,fontSize:11,color:"#334155"}}>v1.0 · Mayo 2026</div>
    </div></div>
  );

  // === MODULE ===
  if(view==="module"&&mod) return (
    <div style={S.page}><div ref={topRef}/><div style={S.wrap}>
      <button onClick={goHome} style={S.back}>‹ Módulos</button>
      <div style={{textAlign:"center",marginBottom:24}}>
        <div style={{fontSize:44}}>{mod.icon}</div>
        <h2 style={{fontFamily:"'Fraunces',serif",fontSize:22,margin:"6px 0 0",color:mod.color}}>{mod.title}</h2>
        <p style={{color:"#94a3b8",fontSize:13}}>{mod.subtitle}</p>
      </div>

      {mod.lessons.map((l,i)=>{
        const d=isDone(mod.id,i);
        return (
          <div key={i} onClick={()=>openLesson(l,i)} style={{background:d?`${mod.color}10`:"#1e293b",borderRadius:14,padding:"16px 18px",marginBottom:10,cursor:"pointer",border:`1px solid ${d?mod.color+"44":"#334155"}`,display:"flex",alignItems:"center",gap:12,transition:"all .2s"}}>
            <div style={{fontSize:22,width:40,height:40,display:"flex",alignItems:"center",justifyContent:"center",background:d?`${mod.color}22`:"#0f172a",borderRadius:10}}>{d?"✅":l.emoji}</div>
            <div style={{flex:1}}>
              <h4 style={{margin:0,fontSize:14,fontWeight:600,color:d?mod.color:"#f1f5f9"}}>{l.title}</h4>
              <p style={{margin:"3px 0 0",fontSize:11,color:"#64748b"}}>{l.theory.length} conceptos · {l.protocol.length} pasos · {l.pearls.length} perlas</p>
            </div>
            <div style={{color:"#475569",fontSize:18}}>›</div>
          </div>
        );
      })}

      <div onClick={openCase} style={{background:"linear-gradient(135deg,#7c3aed22,#4f46e522)",borderRadius:14,padding:18,marginTop:6,cursor:"pointer",border:"1px solid #7c3aed44",textAlign:"center"}}>
        <div style={{fontSize:26}}>🧩</div>
        <h4 style={{margin:"6px 0 3px",fontSize:14,fontWeight:700,color:"#a78bfa"}}>Caso Clínico Interactivo</h4>
        <p style={{margin:0,fontSize:11,color:"#7c3aed"}}>{mod.caseStudy.title}</p>
      </div>
    </div></div>
  );

  // === LESSON ===
  if(view==="lesson"&&lesson&&mod){
    const secs=[
      {key:"theory",label:"📖 Teoría"},
      {key:"protocol",label:"📋 Protocolo paso a paso"},
      {key:"pearls",label:"💎 Perlas clínicas"},
      {key:"videos",label:"🎬 Vídeos recomendados"}
    ];
    return (
      <div style={S.page}><div ref={topRef}/><div style={S.wrap}>
        <button onClick={()=>openMod(mod)} style={S.back}>‹ {mod.title}</button>
        <div style={{textAlign:"center",marginBottom:20}}>
          <div style={{fontSize:38}}>{lesson.emoji}</div>
          <h2 style={{fontFamily:"'Fraunces',serif",fontSize:20,margin:"6px 0 0",color:mod.color}}>{lesson.title}</h2>
        </div>

        {secs.map(s=>{
          const isO=openSec===s.key;
          return (
            <div key={s.key} style={{marginBottom:8}}>
              <button onClick={()=>setOpenSec(isO?null:s.key)} style={{width:"100%",background:isO?`${mod.color}15`:"#1e293b",border:`1px solid ${isO?mod.color+"44":"#334155"}`,borderRadius:isO?"14px 14px 0 0":"14px",padding:"14px 16px",color:"#f1f5f9",fontSize:14,fontWeight:600,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",textAlign:"left",transition:"all .2s"}}>
                <span>{s.label}</span>
                <span style={{transform:isO?"rotate(90deg)":"rotate(0)",transition:"transform .2s",color:"#64748b"}}>›</span>
              </button>
              {isO&&<div style={{background:"#1a2332",border:`1px solid ${mod.color}22`,borderTop:"none",borderRadius:"0 0 14px 14px",padding:"14px 16px"}}>
                {s.key==="theory"&&lesson.theory.map((t,i)=>(
                  <div key={i} style={{marginBottom:i<lesson.theory.length-1?16:0}}>
                    <h5 style={{margin:"0 0 5px",fontSize:13,fontWeight:700,color:mod.color}}>{t.heading}</h5>
                    <p style={{margin:0,fontSize:13,lineHeight:1.7,color:"#cbd5e1"}}>{t.text}</p>
                  </div>
                ))}
                {s.key==="protocol"&&<ol style={{margin:0,paddingLeft:20}}>
                  {lesson.protocol.map((st,i)=>(<li key={i} style={{fontSize:13,lineHeight:1.7,color:"#cbd5e1",marginBottom:7,paddingLeft:4}}>{st}</li>))}
                </ol>}
                {s.key==="pearls"&&lesson.pearls.map((p,i)=>(
                  <div key={i} style={{display:"flex",gap:10,marginBottom:8,padding:"10px 12px",background:"#0f172a",borderRadius:10,borderLeft:`3px solid ${mod.color}`}}>
                    <span style={{fontSize:15,flexShrink:0}}>💎</span>
                    <p style={{margin:0,fontSize:13,lineHeight:1.6,color:"#e2e8f0"}}>{p}</p>
                  </div>
                ))}
                {s.key==="videos"&&lesson.videos.map((v,i)=>(
                  <a key={i} href={v.url} target="_blank" rel="noopener noreferrer" style={{display:"flex",alignItems:"center",gap:10,padding:"12px 14px",background:"#0f172a",borderRadius:10,marginBottom:6,border:"1px solid #334155"}}>
                    <span style={{fontSize:20}}>▶️</span>
                    <span style={{fontSize:13,color:"#38bdf8",fontWeight:500}}>{v.title}</span>
                  </a>
                ))}
              </div>}
            </div>
          );
        })}

        {!isDone(mod.id,lesson.idx)?
          <button onClick={()=>markDone(mod.id,lesson.idx)} style={{width:"100%",marginTop:18,padding:"15px",background:`linear-gradient(135deg,${mod.color},${mod.color}cc)`,border:"none",borderRadius:12,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer"}}>✓ Marcar como completada</button>
        :
          <div style={{textAlign:"center",marginTop:18,padding:"13px",background:`${mod.color}15`,borderRadius:12,border:`1px solid ${mod.color}33`}}>
            <span style={{fontSize:13,color:mod.color,fontWeight:600}}>✅ Lección completada</span>
          </div>
        }
      </div></div>
    );
  }

  // === CASE ===
  if(view==="case"&&mod){
    const cs=mod.caseStudy;
    return (
      <div style={S.page}><div ref={topRef}/><div style={S.wrap}>
        <button onClick={()=>openMod(mod)} style={S.back}>‹ {mod.title}</button>
        <div style={{textAlign:"center",marginBottom:20}}>
          <div style={{fontSize:38}}>🧩</div>
          <h2 style={{fontFamily:"'Fraunces',serif",fontSize:18,margin:"6px 0 0",color:"#a78bfa"}}>{cs.title}</h2>
        </div>

        <div style={{background:"#1e293b",borderRadius:14,padding:16,marginBottom:14,border:"1px solid #334155"}}>
          <h4 style={{margin:"0 0 6px",fontSize:12,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",letterSpacing:1}}>Escenario</h4>
          <p style={{margin:0,fontSize:13,lineHeight:1.7,color:"#e2e8f0"}}>{cs.scenario}</p>
        </div>

        <div style={{background:"#1a2332",borderRadius:14,padding:16,marginBottom:18,border:"1px solid #334155"}}>
          <h4 style={{margin:"0 0 8px",fontSize:12,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",letterSpacing:1}}>Datos clínicos</h4>
          {cs.data.map((d,i)=>(
            <div key={i} style={{display:"flex",gap:8,marginBottom:5}}>
              <span style={{color:mod.color,fontWeight:700,flexShrink:0}}>•</span>
              <p style={{margin:0,fontSize:12,lineHeight:1.6,color:"#cbd5e1",fontFamily:"'DM Sans',monospace"}}>{d}</p>
            </div>
          ))}
        </div>

        <div style={{background:`${mod.color}10`,borderRadius:14,padding:"14px 16px",marginBottom:14,border:`1px solid ${mod.color}33`}}>
          <p style={{margin:0,fontSize:14,fontWeight:700,color:mod.color,textAlign:"center"}}>❓ {cs.question}</p>
        </div>

        {cs.options.map((o,i)=>{
          const sel=selOpt===i;
          const rev=selOpt!==null;
          let bg="#1e293b",brd="#334155";
          if(rev&&sel&&o.correct){bg="#065f4622";brd="#10b981";}
          if(rev&&sel&&!o.correct){bg="#7f1d1d22";brd="#ef4444";}
          if(rev&&!sel&&o.correct){bg="#065f4615";brd="#10b98166";}
          return (
            <div key={i}>
              <button onClick={()=>!rev&&setSelOpt(i)} disabled={rev} style={{width:"100%",background:bg,border:`1px solid ${brd}`,borderRadius:12,padding:"13px 14px",marginBottom:6,cursor:rev?"default":"pointer",textAlign:"left",color:"#e2e8f0",fontSize:13,lineHeight:1.5,transition:"all .2s",opacity:rev&&!sel&&!o.correct?.5:1}}>
                <span style={{fontWeight:600}}>{String.fromCharCode(65+i)}.</span> {o.text}
              </button>
              {rev&&(sel||o.correct)&&(
                <div style={{marginBottom:10,marginTop:-2,padding:"10px 14px",background:o.correct?"#065f4615":"#7f1d1d15",borderRadius:"0 0 12px 12px",borderLeft:`3px solid ${o.correct?"#10b981":"#ef4444"}`}}>
                  <p style={{margin:0,fontSize:12,lineHeight:1.7,color:o.correct?"#6ee7b7":"#fca5a5"}}>{o.explanation}</p>
                </div>
              )}
            </div>
          );
        })}

        {selOpt!==null&&<button onClick={()=>openMod(mod)} style={{width:"100%",marginTop:14,padding:"13px",background:"linear-gradient(135deg,#7c3aed,#6366f1)",border:"none",borderRadius:12,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer"}}>← Volver al módulo</button>}
      </div></div>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
